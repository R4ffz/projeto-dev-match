services:
  db:
    image: postgres:16-alpine
    container_name: devmatch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-devmatch}
      POSTGRES_USER: ${DB_USER:-devmatch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devmatch}
    ports:
      - "5432:5432"
    volumes:
      - devmatch-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-devmatch} -d ${DB_NAME:-devmatch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devmatch-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-devmatch}
      DB_USER: ${DB_USER:-devmatch}
      DB_PASSWORD: ${DB_PASSWORD:-devmatch}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: devmatch-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  devmatch-db-data:
