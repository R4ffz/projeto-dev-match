server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: rotas client-side caem todas no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets imutaveis (hash no nome) podem ser cacheados longamente
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
